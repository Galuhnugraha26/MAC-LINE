name: Bug report
description: Report a reproducible issue in the existing MAC-LINE workflow
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Please avoid putting secrets or exploitable vulnerability details in public issues. See SECURITY.md."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong and which component is affected?
      placeholder: "For example, POST /predict returns an unexpected response for..."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include commands, sample input, and environment details needed to reproduce.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Attach relevant logs or sanitized screenshots.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Windows 11, Python 3.12, Docker version, kind version"
    validations:
      required: false
  - type: checkboxes
    id: safeguards
    attributes:
      label: Submission checks
      options:
        - label: I checked existing issues for duplicates.
          required: true
        - label: I removed secrets and private data from my report.
          required: true
